[package]
name = "wafio-geo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Memory-map the .mmdb files (the city database is ~130 MiB); needs memmap2,
# which maxminddb pulls in only with this feature.
mmap = ["maxminddb/mmap"]

[dependencies]
wafio-application.workspace = true
wafio-bytetext.workspace = true
maxminddb.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
