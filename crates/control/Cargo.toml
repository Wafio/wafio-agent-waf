[package]
name = "wafio-control"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
wafio-engine-rules.workspace = true
wafio-bytetext.workspace = true
wafio-proto.workspace = true
base64.workspace = true
serde.workspace = true
# raw_value: bundle JSON is handed on verbatim; only top-level keys are probed.
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
prost.workspace = true
# start_paused: the retry waits are minutes long.
tokio = { workspace = true, features = ["test-util"] }
