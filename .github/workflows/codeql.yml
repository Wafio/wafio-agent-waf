name: codeql

# CodeQL: static analysis of the Rust source and of the workflows, on every push to main, every pull request and
# once a week. The workspace needs uddin-lang-rs next to it, as in ci.yml.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '53 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write # upload the result to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script interpreter is a path dependency: ../uddin-lang-rs. checkout cannot write outside the workspace,
      # so it is checked out inside and moved next to it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Wafio/uddin-lang-rs
          path: uddin-lang-rs
          persist-credentials: false
      - run: mv uddin-lang-rs ../uddin-lang-rs
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
