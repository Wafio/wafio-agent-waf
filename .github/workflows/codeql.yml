name: codeql

# CodeQL: static analysis of the Rust source and of the workflows, on every push to main, every pull request and
# once a week. The workspace needs uddin-lang-rs next to it, as in ci.yml.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '53 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write # upload the result to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: wafio-agent-waf
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Wafio/uddin-lang-rs
          path: uddin-lang-rs
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          source-root: wafio-agent-waf
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          checkout_path: ${{ github.workspace }}/wafio-agent-waf
