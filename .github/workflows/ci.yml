name: ci

# The gate of scripts/ci-local.sh, on every push to main and every pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: wafio-agent-waf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wafio-agent-waf
      # The script interpreter is a path dependency: ../uddin-lang-rs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Wafio/uddin-lang-rs
          path: uddin-lang-rs
      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wafio-agent-waf/target
          key: cargo-${{ runner.os }}-${{ hashFiles('wafio-agent-waf/rust-toolchain.toml', 'wafio-agent-waf/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # rustup installs the toolchain of rust-toolchain.toml on first use.
      - run: scripts/ci-local.sh
